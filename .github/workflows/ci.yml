name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: yetano_work
          POSTGRES_PASSWORD: yetano
          POSTGRES_USER: yetano
        options: >-
          --health-cmd "pg_isready -U yetano -d yetano_work"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://yetano:yetano@localhost:5432/yetano_work
      TEST_DATABASE_URL: postgresql://yetano:yetano@localhost:5432/yetano_work_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        env:
          PGPASSWORD: yetano
        run: createdb --host localhost --port 5432 --username yetano yetano_work_test
      - name: Migrate runtime database
        run: pnpm db:migrate
      - run: pnpm verify:full
